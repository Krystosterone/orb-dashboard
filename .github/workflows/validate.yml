name: HACS

# The Home Assistant Marketplace and HACS validate a dashboard plugin with this action: hacs.json, the release carrying
# orb-dashboard.js, the README, the repository's description and topics. Kept in Krystosterone/dashhaus at
# hacs/orb-dashboard/; change it there.
on:
  push:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
